services:
  9router:
    image: ${NODE_IMAGE:-node:22-alpine}
    container_name: ${CONTAINER_NAME:-9router}
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-20128}:${PORT:-20128}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-20128}"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-123456}"
      JWT_SECRET: "${JWT_SECRET:-}"
      API_KEY_SECRET: "${API_KEY_SECRET:-}"
      MACHINE_ID_SALT: "${MACHINE_ID_SALT:-}"
      ENABLE_REQUEST_LOGS: "${ENABLE_REQUEST_LOGS:-false}"
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-true}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY:-false}"
      BASE_URL: "${BASE_URL:-http://localhost:${PORT:-20128}}"
      CLOUD_URL: "${CLOUD_URL:-https://9router.com}"
      NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:-http://localhost:${PORT:-20128}}"
      NEXT_PUBLIC_CLOUD_URL: "${NEXT_PUBLIC_CLOUD_URL:-https://9router.com}"
      NEXT_TELEMETRY_DISABLED: "1"
      HTTP_PROXY: "${CONTAINER_HTTP_PROXY:-http://host.docker.internal:7890}"
      HTTPS_PROXY: "${CONTAINER_HTTPS_PROXY:-http://host.docker.internal:7890}"
      ALL_PROXY: "${CONTAINER_ALL_PROXY:-http://host.docker.internal:7890}"
      http_proxy: "${CONTAINER_HTTP_PROXY:-http://host.docker.internal:7890}"
      https_proxy: "${CONTAINER_HTTPS_PROXY:-http://host.docker.internal:7890}"
      all_proxy: "${CONTAINER_ALL_PROXY:-http://host.docker.internal:7890}"
      NO_PROXY: "${CONTAINER_NO_PROXY:-localhost,127.0.0.1,host.docker.internal}"
      no_proxy: "${CONTAINER_NO_PROXY:-localhost,127.0.0.1,host.docker.internal}"
    volumes:
      - ${STANDALONE_DIR:-./.next/standalone}:/app:ro
      - ${HOST_DATA_DIR:-${DATA_DIR:-./data}}:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:${PORT:-20128}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
