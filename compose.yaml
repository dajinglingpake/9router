services:
  9router:
    image: ${IMAGE_NAME:-9router:local}
    container_name: ${CONTAINER_NAME:-9router}
    restart: unless-stopped
    working_dir: /app
    command: ["node", "custom-server.js"]
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      TZ: "${TZ:-Asia/Shanghai}"
      PORT: "${PORT:-20128}"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      INITIAL_PASSWORD: "${INITIAL_PASSWORD:-123456}"
      JWT_SECRET: "${JWT_SECRET:-}"
      API_KEY_SECRET: "${API_KEY_SECRET:-}"
      MACHINE_ID_SALT: "${MACHINE_ID_SALT:-}"
      OBSERVABILITY_ENABLED: "${OBSERVABILITY_ENABLED:-true}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY:-false}"
      BASE_URL: "${BASE_URL:-http://localhost:${PORT:-20128}}"
      CLOUD_URL: "${CLOUD_URL:-https://9router.com}"
      NEXT_PUBLIC_BASE_URL: "${NEXT_PUBLIC_BASE_URL:-http://localhost:${PORT:-20128}}"
      NEXT_PUBLIC_CLOUD_URL: "${NEXT_PUBLIC_CLOUD_URL:-https://9router.com}"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${HOST_DATA_DIR:-./data}:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:${PORT:-20128}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
